<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" style="background:#091b12;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103322" />
      <stop offset="100%" stop-color="#0a1d14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Border -->
  <rect x="2" y="2" width="876" height="256" rx="10" fill="url(#cardGrad)" stroke="#1f4b33" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="14" cy="14" r="14" fill="#144d2d" stroke="#34d399" stroke-width="1.5" />
    <text x="14" y="20" font-size="16" text-anchor="middle" fill="#34d399">🌾</text>
    <text x="40" y="16" font-size="18" font-weight="700" fill="#f3f4f6" letter-spacing="0.5">KhetSathi 360 — Compute &amp; Token Efficiency Architecture</text>
    <text x="40" y="32" font-size="12" fill="#9ca3af">Zero-Token Edge Agronomy Engine + Bounded Multimodal Inference</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(32, 80)">
    <!-- Column 1: Deterministic Engine -->
    <rect x="0" y="0" width="186" height="148" rx="8" fill="#0d2419" stroke="#1b4d35" stroke-width="1" />
    <text x="16" y="24" font-size="11" font-weight="600" fill="#9ca3af" text-transform="uppercase" letter-spacing="0.5">ICAR BASELINE</text>
    <text x="16" y="54" font-size="28" font-weight="800" fill="#34d399">0 <tspan font-size="14" font-weight="500" fill="#9ca3af">tokens</tspan></text>
    <text x="16" y="80" font-size="12" fill="#d1fae5">Deterministic Math</text>
    <text x="16" y="98" font-size="11" fill="#6ee7b7">Latency: &lt; 0.01 ms</text>
    <rect x="16" y="114" width="76" height="18" rx="9" fill="#134e4a" />
    <text x="54" y="127" font-size="10" font-weight="700" fill="#5eead4" text-anchor="middle">100% OFFLINE</text>

    <!-- Column 2: Residual LightGBM -->
    <rect x="202" y="0" width="186" height="148" rx="8" fill="#0d2419" stroke="#1b4d35" stroke-width="1" />
    <text x="218" y="24" font-size="11" font-weight="600" fill="#9ca3af" text-transform="uppercase" letter-spacing="0.5">RESIDUAL LIGHTGBM</text>
    <text x="218" y="54" font-size="28" font-weight="800" fill="#60a5fa">0 <tspan font-size="14" font-weight="500" fill="#9ca3af">tokens</tspan></text>
    <text x="218" y="80" font-size="12" fill="#dbeafe">In-Memory C++ Model</text>
    <text x="218" y="98" font-size="11" fill="#93c5fd">p95 Latency: 0.04 ms</text>
    <rect x="218" y="114" width="94" height="18" rx="9" fill="#1e3a8a" />
    <text x="265" y="127" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">59.6% MAE GAIN</text>

    <!-- Column 3: Multimodal Vision Guardrail -->
    <rect x="404" y="0" width="206" height="148" rx="8" fill="#0d2419" stroke="#1b4d35" stroke-width="1" />
    <text x="420" y="24" font-size="11" font-weight="600" fill="#9ca3af" text-transform="uppercase" letter-spacing="0.5">GEMINI 1.5 SHC OCR</text>
    <text x="420" y="54" font-size="28" font-weight="800" fill="#fbbf24">~1.1k <tspan font-size="14" font-weight="500" fill="#9ca3af">tokens</tspan></text>
    <text x="420" y="80" font-size="12" fill="#fef3c7">Per Physical SHC Scan</text>
    <text x="420" y="98" font-size="11" fill="#fde68a">Pre-Validation: Zero Waste</text>
    <rect x="420" y="114" width="102" height="18" rx="9" fill="#78350f" />
    <text x="471" y="127" font-size="10" font-weight="700" fill="#fde68a" text-anchor="middle">STRICT GUARDRAIL</text>

    <!-- Column 4: Total Farmer Cost -->
    <rect x="626" y="0" width="190" height="148" rx="8" fill="#122d1f" stroke="#22c55e" stroke-width="1.5" />
    <text x="642" y="24" font-size="11" font-weight="600" fill="#86efac" text-transform="uppercase" letter-spacing="0.5">FARMER ACCESS COST</text>
    <text x="642" y="54" font-size="28" font-weight="800" fill="#4ade80">₹0.00 <tspan font-size="14" font-weight="500" fill="#86efac">/ free</tspan></text>
    <text x="642" y="80" font-size="12" fill="#bbf7d0">Public Digital Good</text>
    <text x="642" y="98" font-size="11" fill="#86efac">695 Districts Pan-India</text>
    <rect x="642" y="114" width="100" height="18" rx="9" fill="#14532d" />
    <text x="692" y="127" font-size="10" font-weight="700" fill="#86efac" text-anchor="middle">100% UNRESTRICTED</text>
  </g>
</svg>
