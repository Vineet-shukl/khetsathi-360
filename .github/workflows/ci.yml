name: KhetSathi 360 CI & Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate-and-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest

    - name: Phase 1 - Ruff Code Formatting Check
      run: |
        python -m ruff format --check app tests ml_pipeline scripts

    - name: Phase 2 - Ruff Lint & Ambiguity Verification
      run: |
        python -m ruff check app tests ml_pipeline scripts

    - name: Phase 3 - Plankton Quality Gate & ML Promotion Verification
      run: |
        python scripts/quality_gate.py

    - name: Phase 4 - Pytest Full Regression Suite
      run: |
        python -m pytest
